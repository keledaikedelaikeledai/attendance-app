name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/attendance-app
  BUN_VERSION: 1.4.2
  CHANGELOGEN_VERSION: 0.6.2

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Test, release, and publish image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master with full history
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --no-save

      - name: Run regression tests
        run: bun test

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Generate release version and changelog
        run: |
          bunx changelogen@${CHANGELOGEN_VERSION} \
            --bump \
            --${{ inputs.bump }} \
            --no-commit \
            --no-tag

      - name: Read release version
        id: version
        run: |
          VERSION="$(bun -e 'console.log(JSON.parse(await Bun.file("package.json").text()).version)')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${VERSION}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Commit release metadata and create tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git add package.json CHANGELOG.md
          git commit -m "chore(release): v${VERSION}"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin master
          git push origin "${TAG}"

      - name: Create GitHub release from changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: bunx changelogen@${CHANGELOGEN_VERSION} gh release "${TAG}"
